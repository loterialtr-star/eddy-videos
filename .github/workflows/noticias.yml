name: Noticias con Eddy - TELEMUNDO

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *'
    - cron: '42 11 * * *'
    - cron: '17 23 * * *'
    - cron: '0 1 * * *'

concurrency:
  group: noticias-eddy
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SALIDA: salida
      TZ: America/Santo_Domingo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -r requirements.txt

      - name: Generar video de noticias
        run: python robot/noticiero.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Verificar calidad
        run: python robot/verificar.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Subir artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-noticias-${{ github.run_number }}
          path: |
            salida/
            tiktok-noticias/
          retention-days: 7

      - name: Publicar en YouTube
        if: always()
        continue-on-error: true
        env:
          PUBLICAR: ${{ vars.PUBLICAR }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SALIDA: salida
        run: python robot/publicar_youtube.py

      - name: Publicar en Facebook Noticias
        if: always()
        continue-on-error: true
        env:
          PUBLICAR: ${{ vars.PUBLICAR_FB_NOTICIAS }}
          TIPO: noticias
          FB_PAGE_ID: ${{ secrets.FB_NOTICIAS_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_NOTICIAS_TOKEN }}
          FB_PRIMERO_DIOS_ID: ${{ secrets.FB_PRIMERO_DIOS_ID }}
          SALIDA: salida
        run: python robot/publicar_facebook.py
