
name: Reel de fe (Primero Dios)
# Regla: franja 06:00-09:30 La Paz con 4 h de separacion => solo cabe 1 reel al dia (06:30 La Paz = 10:30 UTC).
on:
  workflow_dispatch:
  schedule:
    - cron: "30 10 * * *"
concurrency: fe
permissions: { contents: write }
jobs:
  fe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env: { SALIDA: salida-fe }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - run: python robot/armar_fe.py
      - run: python robot/verificar_fe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: reel-fe, path: "salida-fe/*.*", retention-days: 7 }
      - name: Publicar en Primero Dios (apagado hasta confirmacion)
        id: pub
        env:
          PUBLICAR: ${{ vars.PUBLICAR_FE }}
          TIPO: fe
          FB_PAGE_ID: ${{ secrets.FB_PRIMERO_DIOS_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PRIMERO_DIOS_TOKEN }}
        run: python robot/publicar_facebook.py | tee pub.log
      - name: Marcar historia como usada (solo si se publico)
        run: |
          grep -q "^Facebook:" pub.log || exit 0
          python -c "import json;u=json.load(open('robot/fe/usadas.json'));u['usadas'].append(json.load(open('salida-fe/fe.json'))['historia_id']);json.dump(u,open('robot/fe/usadas.json','w'))"
          git config user.name robot && git config user.email robot@users.noreply.github.com
          git commit -am "fe: historia usada" && git push
