name: Carrete de fe (Primero Dios)

# Regla: franja 06:00-09:30 La Paz con 4 h de separación
# => solo cabe 1 carrete al día (06:30 La Paz = 10:30 UTC).
# La Paz no cambia de horario (UTC-4 fijo), así que 10:30 UTC siempre son 06:30 en Bolivia.

on:
  schedule:
    - cron: "30 10 * * *"    # 10:30 UTC = 06:30 La Paz
  workflow_dispatch:          # permite dispararlo a mano para probar

concurrency:
  group: fe
  cancel-in-progress: false

permissions:
  contents: write             # necesario para el commit de usadas.json

jobs:
  fe:
    name: Reel de fe
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SALIDA: salida-fe

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar ffmpeg y fuentes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Armar reel
        run: python robot/armar_fe.py

      - name: Verificar reel
        run: python robot/verificar_fe.py

      - name: Subir artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-fe
          path: salida-fe/*.*
          retention-days: 7

      - name: Publicar en Primero Dios (apagado hasta confirmación)
        id: pub
        env:
          PUBLICAR: ${{ vars.PUBLICAR_FE }}
          TIPO: fe
          FB_PAGE_ID: ${{ secrets.FB_PRIMERO_DIOS_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PRIMERO_DIOS_TOKEN }}
        run: python robot/publicar_facebook.py | tee pub.log

      - name: Marcar historia como usada (solo si se publicó)
        if: always()
        run: |
          # Si no se publicó, no hay nada que marcar.
          grep -q "^Facebook:" pub.log 2>/dev/null || exit 0

          # Marcar historia en usadas.json de forma segura e idempotente.
          python - <<'PYEOF'
          import json
          from pathlib import Path

          usados_path = Path("robot/fe/usadas.json")
          fe_path = Path("salida-fe/fe.json")

          if not fe_path.exists():
              print("No existe salida-fe/fe.json, se omite marcado")
              raise SystemExit(0)

          data = {"usadas": []}
          if usados_path.exists():
              try:
                  data = json.loads(usados_path.read_text(encoding="utf-8"))
              except json.JSONDecodeError:
                  print("usadas.json corrupto, se reinicia")
                  data = {"usadas": []}

          data.setdefault("usadas", [])
          fe = json.loads(fe_path.read_text(encoding="utf-8"))
          historia_id = fe.get("historia_id")

          if not historia_id:
              print("fe.json no tiene historia_id, se omite")
              raise SystemExit(0)

          if historia_id in data["usadas"]:
              print(f"Historia {historia_id} ya estaba marcada")
              raise SystemExit(0)

          data["usadas"].append(historia_id)
          usados_path.parent.mkdir(parents=True, exist_ok=True)
          usados_path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(f"Historia {historia_id} marcada como usada")
          PYEOF

          # Commit solo si hay cambios reales.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add robot/fe/usadas.json

          if git diff --staged --quiet; then
            echo "Sin cambios que commitear"
          else
            git commit -m "fe: historia usada [skip ci]"
            git push
          fi
