name: Noticias

on:
  schedule:
    # Todos los días a las 08:00 UTC (04:00 RD)
    - cron: '0 8 * * *'
  push:
    branches: [ main ]
    paths:
      - '**.md'
      - 'noticias/**'
      - '.github/workflows/noticias.yml'
  workflow_dispatch:
    inputs:
      categoria:
        description: 'Categoría de noticias a procesar'
        required: false
        default: 'todas'
        type: choice
        options:
          - todas
          - nacionales
          - internacionales
          - tecnologia
          - deportes

jobs:
  generar-noticias:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node (cambia a Python si prefieres)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Si usas Python, reemplaza el paso anterior con:
      # - uses: actions/setup-python@v5
      #   with:
      #     python-version: '3.11'

      - name: Instalar dependencias
        run: |
          if [ -f package.json ]; then npm ci; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Ejecutar generador de noticias
        env:
          CATEGORIA: ${{ inputs.categoria || 'todas' }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          echo "Generando noticias para categoría: $CATEGORIA"
          # Pon aquí tu script real:
          # node scripts/noticias.js
          # o
          # python scripts/noticias.py
          
          # Ejemplo temporal - crea un archivo de ejemplo
          mkdir -p noticias
          echo "# Noticias - $(date -I)" > noticias/$(date +%Y-%m-%d).md
          echo "" >> noticias/$(date +%Y-%m-%d).md
          echo "Actualizado automáticamente por GitHub Actions" >> noticias/$(date +%Y-%m-%d).md

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add noticias/ || true
          if git diff --staged --quiet; then
            echo "No hay cambios para commitear"
          else
            git commit -m "chore: actualiza noticias $(date +%Y-%m-%d) [skip ci]"
            git push
          fi

if __name__ == "__main__":
    main()
