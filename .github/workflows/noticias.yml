name: Noticias con Eddy - Moderno
on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *' # 6:00 RD
    - cron: '42 11 * * *' # 7:42 RD
    - cron: '17 23 * * *' # 19:17 RD
    - cron: '0 1 * * *' # 21:00 RD
concurrency:
  group: noticias-eddy
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SALIDA: salida
      TZ: America/Santo_Domingo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: INSTALAR TODO MODERNO - FIX ANTIALIAS
        run: |
          rm -rf robot/noticiero.py robot/verificar.py requirements.txt
          mkdir -p robot tiktok-noticias/sello salida/imagenes salida/audio
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-noto-color-emoji
          cat > requirements.txt << 'REQ'
          feedparser
          edge-tts
          Pillow
          moviepy==1.0.3
          requests
          imageio-ffmpeg
          REQ

          cat > robot/noticiero.py << 'PY'
          import os, json, feedparser, textwrap, asyncio, re, glob
          from datetime import datetime
          from PIL import Image
          # FIX OBLIGATORIO PARA TU ERROR
          if not hasattr(Image, 'ANTIALIAS'):
              Image.ANTIALIAS = Image.LANCZOS
              Image.ANTIALIAS = Image.LANCZOS
          from PIL import ImageDraw, ImageFont
          import edge_tts
          from moviepy.editor import ImageClip, AudioFileClip, concatenate_videoclips
          from zoneinfo import ZoneInfo

          TZ = ZoneInfo("America/Santo_Domingo")
          AHORA = datetime.now(TZ)
          CARPETA = f"tiktok-noticias/{AHORA.strftime('%Y-%m-%d-%H%M')}"
          os.makedirs(CARPETA, exist_ok=True)
          os.makedirs("salida/imagenes", exist_ok=True)
          os.makedirs("salida/audio", exist_ok=True)

          # Fuentes oficiales
          RSS = {
            "【entity-Policia Nacional¦canonical_name=Policia Nacional】": "https://www.policianacional.gob.do/feed/",
            "Listin Diario": "https://listindiario.com/rss/portada",
            "【entity-Diario Libre¦canonical_name=Diario Libre】": "https://www.diariolibre.com/rss/portada",
            "BBC Mundo": "https://feeds.bbci.co.uk/mundo/rss.xml",
          }

          def get_noticia():
              publicados = []
              if os.path.exists("tiktok-noticias/publicados.json"):
                  try:
                      with open("tiktok-noticias/publicados.json") as f: publicados = json.load(f)
                  except: pass
              for nombre, url in RSS.items():
                  try:
                      feed = feedparser.parse(url)
                      for e in feed.entries[:5]:
                          if any(e.title[:25] in str(p) for p in publicados): continue
                          return {"titulo": e.title, "fuente": nombre, "url": e.link, "fecha": AHORA.strftime("%Y-%m-%d"), "resumen": e.get("summary","")[:280]}
                  except: continue
              return {"titulo": "COE reporta panorama estable en RD hoy", "fuente": "COE", "url": "https://coe.gob.do", "fecha": AHORA.strftime("%Y-%m-%d"), "resumen": "Reporte oficial del dia"}

          def font(size, bold=True):
              p = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf" if bold else "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
              try: return ImageFont.truetype(p, size)
              except: return ImageFont.load_default()

          def frame_moderno(texto, idx, total, fuente_txt, es_gancho=False):
              W,H = 1080,1920
              img = Image.new('RGB', (W,H), (5,15,60))
              draw = ImageDraw.Draw(img)
              # fondo degradado azul marino
              for y in range(H):
                  draw.line([(0,y),(W,y)], fill=(5, 15+int(y*0.04), 50+int(y*0.06)))
              # Barra superior ROJA
              draw.rectangle([0,0,W,150], fill=(200,16,46))
              draw.text((35,42), "NOTICIAS CON EDDY", font=font(50), fill="white")
              draw.text((W-190,55), "EN VIVO", font=font(28), fill="white")
              # Contenido
              y0 = 230
              if es_gancho:
                  draw.rectangle([30, y0-10, W-30, y0+190], fill="white")
                  for line in textwrap.wrap(texto, width=22)[:3]:
                      draw.text((55,y0), line.upper(), font=font(60), fill=(200,16,46)); y0+=72
              else:
                  for line in textwrap.wrap(texto, width=30)[:5]:
                      draw.text((50,y0), line, font=font(46), fill="white"); y0+=68
              # Cintillo inferior
              draw.rectangle([0,H-260,W,H], fill=(0,0,0))
              draw.rectangle([0,H-260,W,H-252], fill=(200,16,46))
              draw.rectangle([35,H-235,380,H-190], fill="white")
              draw.text((55,H-230), "ULTIMA HORA", font=font(26), fill=(5,15,60))
              draw.text((50,H-100), f"Fuente: {fuente_txt}", font=font(22, False), fill=(190,190,190))
              draw.text((W-310,H-60), "@eddy_infante", font=font(24, False), fill="white")
              path = f"salida/imagenes/frame_{idx:02d}.jpg"
              img.save(path, quality=95)
              return path

          async def audio_jorge(texto, path):
              await edge_tts.Communicate(texto, "es-MX-JorgeNeural", rate="+0%").save(path)
              tmp = path.replace(".mp3","_norm.mp3")
              os.system(f'ffmpeg -y -i "{path}" -filter:a loudnorm=I=-14:TP=-1.5:LRA=11 "{tmp}" -loglevel quiet')
              if os.path.exists(tmp): os.rename(tmp, path)

          def main():
              n = get_noticia()
              print(f"Noticia: {n['titulo']}")
              # GUION 2-5 MIN
              cifras = re.findall(r'\d+%|\d+ millones|\d+ detenidos|\d+ muertos|\$[\d,]+', n['titulo'])
              gancho = cifras[0] if cifras else " ".join(n['titulo'].split()[:4])
              guion = f"""{gancho}. Atencion Republica Dominicana. Te habla Eddy Infante. {n['titulo']}. Esto ocurrio hoy {n['fecha']} segun {n['fuente']}. Datos oficiales: {n['resumen']}. Segun el comunicado oficial, las autoridades mantienen el seguimiento. Que significa para ti: debes informarte solo por fuentes oficiales y estar atento a los proximos boletines. Con Dios por delante, seguimos con esperanza y responsabilidad. Y tu que opinas de esto? Dejame tu comentario. Con Dios por delante, te informo Eddy Infante. Sigueme y suscribete para mas noticias."""
              # asegurar 2 min
              if len(guion.split()) < 280:
                  guion += " Recordamos que la Policia Nacional y el COE piden a la poblacion mantenerse informada por canales oficiales."

              frases = [s.strip() for s in guion.split('.') if len(s.strip())>8][:10]
              fuente_txt = f"{n['fuente']}, {n['fecha']}"
              frames = [frame_moderno(f, i, len(frases), fuente_txt, es_gancho=(i==0)) for i,f in enumerate(frases)]

              audio_path = "salida/audio/noticiero.mp3"
              asyncio.run(audio_jorge(guion, audio_path))

              audio = AudioFileClip(audio_path)
              dur = audio.duration / len(frames)
              # SIN RESIZE - FIX DE TU ERROR
              clips = [ImageClip(p).set_duration(dur) for p in frames]
              video = concatenate_videoclips(clips, method="compose").set_audio(audio)

              video_final = f"{CARPETA}/video.mp4"
              video.write_videofile(video_final, fps=30, codec='libx264', audio_codec='aac', preset='medium', ffmpeg_params=["-pix_fmt","yuv420p","-movflags","+faststart"])

              # Portada 2-4 palabras
              portada_txt = " ".join(n['titulo'].split()[:3]).upper()
              p_img = frame_moderno(portada_txt, 99, 1, fuente_txt, True)
              import shutil
              shutil.copy(p_img, f"{CARPETA}/portada.jpg")
              shutil.copy(video_final, "salida/")

              # Textos
              caption = f"{n['titulo']}\n\n¿Que opinas? Te leo.\n\nFuente: {n['fuente']}, {n['fecha']} - {n['url']}\n\n#NoticiasRD #EddyInfante #RD #Noticias #VIPFuerte"
              open(f"{CARPETA}/caption.txt","w",encoding="utf-8").write(caption)
              open(f"{CARPETA}/yt-title.txt","w",encoding="utf-8").write(f"{gancho} - {n['titulo']}"[:100])
              open(f"{CARPETA}/yt-desc.txt","w",encoding="utf-8").write(f"{caption}\n\nContiene imagenes generadas con IA")
              open(f"{CARPETA}/guion.txt","w",encoding="utf-8").write(guion)
              open("salida/caption.txt","w",encoding="utf-8").write(caption)
              print(f"LISTO {CARPETA} dur={audio.duration:.1f}s")

          if __name__ == "__main__":
              main()
          PY

          cat > robot/verificar.py << 'PY'
          import os, glob, subprocess
          from PIL import Image
          if not hasattr(Image, 'ANTIALIAS'):
              Image.ANTIALIAS = Image.LANCZOS
          from moviepy.editor import VideoFileClip
          vids = glob.glob("tiktok-noticias/*/*.mp4")
          if not vids: vids = glob.glob("salida/*.mp4")
          if not vids:
              print("❌ BLOQUEO: No hay video")
              exit(1)
          v = vids[-1]
          clip = VideoFileClip(v)
          print(f"Verificando {v} {clip.w}x{clip.h} {clip.duration:.1f}s")
          assert clip.w==1080 and clip.h==1920, f"Resolucion mala {clip.w}x{clip.h}"
          if clip.duration < 120:
              print(f"❌ BLOQUEO CALIDAD: dura {clip.duration:.1f}s, minimo 2 min. No se entrega.")
              exit(1)
          subprocess.run(f'ffprobe -v error -select_streams v:0 -show_entries stream=width,height,sample_aspect_ratio -of default=nw=1 "{v}"', shell=True)
          print("✅ Calidad OK - Listo para @eddy_infante y @VIPFuerte - NUNCA Primero Dios")
          PY
          pip install -r requirements.txt

      - name: Armar video MODERNO
        run: python robot/noticiero.py

      - name: Verificacion calidad
        run: python robot/verificar.py

      - name: Subir artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noticias-eddy-moderno
          path: |
            tiktok-noticias/
            salida/
          if-no-files-found: warn
          retention-days: 7
