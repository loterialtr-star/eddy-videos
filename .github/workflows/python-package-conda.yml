name: CI — Sanity check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint y sintaxis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar ffmpeg (necesario por si algún módulo lo importa)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 pytest

      - name: Lint con flake8 — solo errores fatales
        run: |
          flake8 . --count --select=E9,F63,F7,F82 \
            --show-source --statistics \
            --exclude=.git,__pycache__,outputs,salida-fe
          flake8 . --count --exit-zero --max-complexity=10 \
            --max-line-length=127 --statistics \
            --exclude=.git,__pycache__,outputs,salida-fe

      - name: Test con pytest (si hay tests)
        run: |
          if find . -name "test_*.py" -o -name "*_test.py" | grep -q .; then
            pytest -q
          else
            echo "No hay tests, se omite pytest"
          fi
